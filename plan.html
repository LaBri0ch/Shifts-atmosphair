<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1119">
<title>Plan — Planning</title>
<link rel="stylesheet" href="assets/style.css?v=6">
<script src="assets/commun.js?v=6"></script>
</head>
<body>
<div class="wrap">
  <header class="top" id="top"></header>
  <main id="app"><p class="chargement">Chargement du planning…</p></main>
  <p class="pied" id="pied"></p>
</div>
<nav id="tabbar"></nav>
<script>
/* assets/commun.js introuvable : on dit pourquoi au lieu de rester sur « Chargement… » */
if(!window.WEI){
  document.getElementById("app").innerHTML =
    '<div style="border:2px solid #FF6B5E;border-radius:14px;padding:16px 18px;margin:16px 0;line-height:1.5;' +
    'font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#EAF2F7;background:#111C27">' +
    '<b style="color:#FF6B5E;font-size:1.1rem">Le site est incomplet</b><br>' +
    'Il manque le dossier <b>assets</b> (et sans doute <b>config</b>) à côté de cette page.<br><br>' +
    (location.protocol === "file:"
      ? '<b>Tu as sans doute ouvert la page directement dans le fichier .zip.</b> Windows n\'en sort alors que cette page. ' +
        'Fais clic droit sur le .zip &rsaquo; <b>Extraire tout</b>, puis ouvre <b>index.html</b> dans le dossier extrait.'
      : '<b>Sur GitHub</b>, les dossiers <b>assets</b> et <b>config</b> doivent être à la racine du dépôt, à côté de index.html. ' +
        'Dans « Add file &rsaquo; Upload files », glisse-dépose les dossiers eux-mêmes depuis l\'explorateur : ' +
        'le bouton « choose your files » ne prend que des fichiers et perd les dossiers.') +
    '</div>';
  document.body.style.background = "#0A1119";
} else {
/* Plan du camping, zoomable aux boutons ou à deux doigts. */
WEI.demarrer({page:"plan"}, function(D){
  var W = WEI, app = document.getElementById("app");
  app.appendChild(W.el('<h2 class="lead">Plan</h2>'));
  if(D.plan.legende) app.appendChild(W.el('<p class="meta">' + W.esc(D.plan.legende) + '</p>'));
  if(!D.plan.src){
    app.appendChild(W.el('<div class="none"><b>Pas de plan pour l\'instant</b>L\'orga l\'ajoute dans l\'admin.</div>'));
    return;
  }
  var box = W.el('<div class="planbox"></div>');
  var img = W.el('<img alt="Plan du site" src="' + W.esc(D.plan.src) + '">');
  img.addEventListener("error", function(){
    box.innerHTML = '<p class="meta" style="padding:16px">Le plan n\'a pas pu être chargé (' + W.esc(D.plan.src) + ').</p>';
  });
  box.appendChild(img);
  app.appendChild(box);

  var base = D.plan.w || 1600, zoom = 1;
  var z = W.el('<div class="zoom"><button aria-label="Dézoomer">−</button><button aria-label="Zoomer">+</button>' +
    '<button style="min-width:auto;padding:0 14px;font-size:.85rem">Ajuster</button><span class="lvl"></span></div>');
  var bt = z.querySelectorAll("button"), lvl = z.querySelector(".lvl");
  function applique(){ img.style.width = Math.round(base * zoom) + "px"; lvl.textContent = Math.round(zoom * 100) + " %"; }
  function ajuste(){ zoom = Math.max(0.15, (box.clientWidth - 18) / base); applique(); }
  bt[0].addEventListener("click", function(){ zoom = Math.max(0.15, zoom / 1.25); applique(); });
  bt[1].addEventListener("click", function(){ zoom = Math.min(3, zoom * 1.25); applique(); });
  bt[2].addEventListener("click", ajuste);
  app.appendChild(z);
  app.appendChild(W.el('<p class="meta" style="margin-top:8px">Tu peux aussi zoomer à deux doigts et faire glisser le plan.</p>'));
  ajuste();
  var mini = W.sosPetit(); if(mini) app.appendChild(mini);
});
}</script>
</body>
</html>
